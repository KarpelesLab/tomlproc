# A differential-testing harness, kept out of the published crate: `tomlproc`
# itself has no dependencies, and this compares it against one.
#
# `[workspace]` detaches this from the parent package so `cargo build` at the
# repository root never reaches it, and `exclude = ["tools"]` in the parent
# manifest keeps it out of the published `.crate` file.
[workspace]

[package]
name = "difftest"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The reference implementation, pinned to the release that targets the same
# spec version this crate does (TOML 1.1.0).
toml = "=1.1.5"
tomlproc = { path = "../.." }
