[package]
name = "tomlproc"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A self-contained TOML 1.1.0 parser and serializer with no external dependencies"
authors = ["Mark Karpeles <mark@shells.com>"]
repository = "https://github.com/KarpelesLab/tomlproc"
license = "MIT"
keywords = ["toml", "parser", "config", "serialization"]
categories = ["parser-implementations", "config", "encoding"]
readme = "README.md"
# `tools/` holds a differential-testing harness that depends on the `toml`
# crate; it is development-only and never part of the published package.
exclude = ["tools"]

[features]
default = ["std"]
# `std` implies `alloc`. On its own it only chooses the hash-based index for
# tables; without it the crate is `no_std` and uses ordered maps instead.
std = ["alloc", "serde?/std"]
# The heap-backed half of the crate: the value model, the parser, the
# serializer. Without it, what is left is the date-time types and their
# parsing, which need no allocator.
alloc = ["serde?/alloc"]
# Serialize/Deserialize for the value model, plus `tomlproc::serde::{from_str,
# to_string, ...}` for mapping documents onto your own types.
serde = ["dep:serde", "alloc"]

[dependencies]
# The only dependency, and only when the `serde` feature asks for it. Its own
# `std`/`alloc` features follow this crate's.
serde = { version = "1.0", optional = true, default-features = false }

[dev-dependencies]
# Tests for the `serde` feature derive impls; never built for consumers.
serde = { version = "1.0", features = ["derive"] }

[package.metadata.docs.rs]
# Document the `serde` feature's API, marked with the feature it needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
